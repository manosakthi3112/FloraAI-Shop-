<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_product.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Edit Product</h1>
        </header>
        <form action="{{ url_for('edit_product', product_id=product['_id']) }}" method="POST" class="edit-form">
            <div class="form-group">
                <label for="fname">Flower Name:</label>
                <input 
                    type="text" 
                    id="fname" 
                    name="fname" 
                    value="{{ product.get('flower_name', '') }}" 
                    required 
                    placeholder="Enter the flower name"
                >
            </div>
            <div class="form-group">
                <label for="price">Flower Price (₹):</label>
                <input 
                    type="text" 
                    id="price" 
                    name="price" 
                    value="{{ product.get('flower_price', '') }}" 
                    required 
                    pattern="\d+(\.\d{1,2})?" 
                    title="Enter a valid price (e.g., 123 or 123.45)" 
                    placeholder="Enter the flower price"
                >
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">Update</button>
                <a href="{{ url_for('main_div') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
