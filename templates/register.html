<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <!-- Note: In a real project, this CSS would be in a separate styles_register.css file -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap'); /* Elegant font for headings */

        :root {
            --primary-gold: #FFD700; /* Classic Gold */
            --secondary-gold: #B8860B; /* DarkGoldenRod - for accents or darker shades */
            --rich-black: #0D0D0D; /* A very dark black */
            --content-black: #1A1A1A; /* Slightly lighter black for form elements */
            --text-color-light: #E0E0E0; /* Off-white for general text */
            --text-gold-accent: #FFD700;

            --success-color: #28a745; /* Keep standard for clarity */
            --error-color: #dc3545;   /* Keep standard for clarity */
            
            --form-bg-color-light: rgba(10, 10, 10, 0.6); /* Translucent dark for glassmorphism */
            --form-border-color: rgba(255, 215, 0, 0.25); /* Subtle gold border */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--rich-black); /* Solid rich black background */
            /* Or a subtle gradient:
            background: linear-gradient(135deg, #222 0%, var(--rich-black) 100%);
            */
            color: var(--text-color-light);
            line-height: 1.6;
            overflow-x: hidden; /* Prevent horizontal scroll from potential glow effects */
        }

        .container {
            width: 100%;
            max-width: 480px; /* Slightly wider for a more premium feel */
            padding: 20px;
        }

        .register-form-wrapper {
            background: var(--form-bg-color-light);
            padding: 40px 45px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--form-border-color);
            backdrop-filter: blur(12px);
            border: 1px solid var(--form-border-color);
        }

        .register-form-wrapper h2 {
            text-align: center;
            margin-bottom: 30px;
            font-family: 'Cinzel', serif; /* Elegant serif font */
            font-weight: 700;
            font-size: 2.5em;
            color: var(--primary-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 300;
            font-size: 0.9em;
            color: var(--text-color-light);
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 215, 0, 0.3); /* Gold-tinted border */
            background: rgba(0,0,0,0.2); /* Darker transparent background */
            border-radius: 8px;
            color: var(--text-color-light);
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(224, 224, 224, 0.5);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); /* Gold glow */
        }

        #password-strength {
            margin-top: -10px;
            margin-bottom: 20px;
            padding-left: 5px; /* Align with input text a bit */
        }

        #password-strength ul {
            list-style: none;
            padding: 0;
            font-size: 0.8em;
        }

        #password-strength li {
            color: rgba(224, 224, 224, 0.8);
            transition: color 0.3s;
            position: relative;
            padding-left: 25px; /* Space for icon */
            margin-bottom: 5px;
        }
        
        #password-strength li::before {
            content: '○'; /* Default bullet */
            position: absolute;
            left: 5px;
            font-weight: bold;
            transition: content 0.3s, color 0.3s;
            font-size: 1.1em;
            line-height: 1;
        }

        #password-strength li.valid {
            color: var(--text-gold-accent);
        }
        #password-strength li.valid::before {
            content: '✔';
            color: var(--text-gold-accent);
        }

        #password-strength li.invalid {
            color: var(--error-color); /* Keep red for error indication */
        }
        #password-strength li.invalid::before {
            content: '✖';
            color: var(--error-color);
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, var(--secondary-gold), var(--primary-gold));
            color: var(--rich-black); /* Text color on button */
            font-size: 1.2em;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3), 0 4px 10px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, var(--primary-gold), var(--secondary-gold)); /* Invert gradient on hover */
        }

        button[type="submit"]:active {
            transform: translateY(-1px);
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.2), 0 2px 5px rgba(0,0,0,0.2);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-weight: 300;
            font-size: 0.95em;
        }

        .login-link a {
            color: var(--primary-gold);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .login-link a:hover {
            color: #FFFACD; /* Lighter gold on hover */
            text-decoration: underline;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        #message {
            text-align: center;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 400;
            display: none; /* Hidden by default */
            border-width: 1px;
            border-style: solid;
        }
        
        #message.success {
            background-color: rgba(40, 167, 69, 0.15); /* Darker, subtle green background */
            color: #d4edda;
            border-color: var(--success-color);
            display: block;
        }

        #message.error {
            background-color: rgba(220, 53, 69, 0.15); /* Darker, subtle red background */
            color: #f8d7da;
            border-color: var(--error-color);
            display: block;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="register-form-wrapper">
            <h2>Create Account</h2>
            
            <div id="message"></div>

            <form id="register-form" method="POST" onsubmit="return handleFormSubmit(event)">
                
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a unique username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                </div>
                
                <div id="password-strength">
                    <ul>
                        <li id="length">At least 8 characters</li>
                        <li id="uppercase">At least one uppercase letter (A-Z)</li>
                        <li id="number">At least one number (0-9)</li>
                        <li id="symbol">At least one special symbol (!@#$%)</li>
                    </ul>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter your password" required>
                </div>

                <button type="submit">Register</button>
            </form>

            <p class="login-link">
                Already have an account? <a href="{{ url_for('login') }}">Login</a>
            </p>
        </div>
    </div>

    <script>
        // DOM Elements
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const form = document.getElementById('register-form');
        const messageDiv = document.getElementById('message');

        // Password strength requirement elements
        const lengthCheck = document.getElementById('length');
        const uppercaseCheck = document.getElementById('uppercase');
        const numberCheck = document.getElementById('number');
        const symbolCheck = document.getElementById('symbol');

        // Regular Expressions for validation
        const uppercaseRegex = /[A-Z]/;
        const numberRegex = /[0-9]/;
        const symbolRegex = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/; // Consider escaping - and ]

        let passwordIsValid = false;

        // Function to update the validation checklist
        const validatePassword = () => {
            const password = passwordInput.value;
            let checks = {
                length: password.length >= 8,
                uppercase: uppercaseRegex.test(password),
                number: numberRegex.test(password),
                symbol: symbolRegex.test(password),
            };

            lengthCheck.className = checks.length ? 'valid' : 'invalid';
            uppercaseCheck.className = checks.uppercase ? 'valid' : 'invalid';
            numberCheck.className = checks.number ? 'valid' : 'invalid';
            symbolCheck.className = checks.symbol ? 'valid' : 'invalid';

            passwordIsValid = Object.values(checks).every(Boolean);
        };

        passwordInput.addEventListener('input', validatePassword);

        const showMessage = (text, type) => {
            messageDiv.textContent = text;
            messageDiv.className = type; 
            messageDiv.style.display = 'block'; // Ensure it's visible
        };

        const handleFormSubmit = (event) => {
            event.preventDefault();
            validatePassword(); // Ensure validation is run on submit attempt

            const username = document.getElementById('username').value;
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            messageDiv.textContent = '';
            messageDiv.className = '';
            messageDiv.style.display = 'none';


            if (username.trim() === '') {
                 showMessage('Username cannot be empty.', 'error');
                 return false;
            }

            if (!passwordIsValid) {
                showMessage('Your password does not meet all the requirements.', 'error');
                passwordInput.focus();
                return false; 
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match. Please try again.', 'error');
                confirmPasswordInput.focus();
                return false;
            }

            showMessage('Registration successful! Preparing your account...', 'success');
            
            setTimeout(() => {
                form.submit();
            }, 2000); 
        };
    </script>
</body>
</html>
